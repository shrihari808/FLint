[workspace]
resolver = "2"
members = [
    "crates/flint-core",
    "crates/flint-flp",
    "crates/flint-vst-scan",
    "crates/flint-sync",
    "crates/flint-daemon",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
flint-core = { path = "crates/flint-core" }
flint-flp = { path = "crates/flint-flp" }
flint-vst-scan = { path = "crates/flint-vst-scan" }
flint-sync = { path = "crates/flint-sync" }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
