[workspace]
resolver = "2"
members = [
    "crates/flint-core",
    "crates/flint-flp",
    "crates/flint-vst-scan",
    "crates/flint-sync",
    "crates/flint-daemon",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
flint-core = { path = "crates/flint-core" }
flint-flp = { path = "crates/flint-flp" }
flint-vst-scan = { path = "crates/flint-vst-scan" }
flint-sync = { path = "crates/flint-sync" }

anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures-lite = "2.6"
iroh = "1"
iroh-blobs = "0.103"
iroh-docs = "0.101"
iroh-gossip = "0.101"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
ulid = "1.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
